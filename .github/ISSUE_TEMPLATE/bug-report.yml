name: "🐛 Bug Report"
description: "File a bug to help us improve"
title: "[Bug] "
labels: ["needs-help"]
body:
  - type: markdown
    attributes:
      value: |
        ## 🐛 Bug Description
        Describe the bug clearly.

  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: "1. ...
2. ...
3. ..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected behavior"
      placeholder: "What did you expect to happen?"
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: "Actual behavior"
      placeholder: "What actually happened?"
    validations:
      required: true

  - type: textarea
    id: env
    attributes:
      label: "Environment"
      placeholder: "OS, runtime versions, etc."
